<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#2639C9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EAFF"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A6B"/>
      <stop offset="1" stop-color="#F0384A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A1A6B" flood-opacity="0.35"/>
    </filter>
    <clipPath id="envelopeClip">
      <rect x="222" y="318" width="580" height="400" rx="58"/>
    </clipPath>
  </defs>

  <!-- macOS icon grid: 824×824 body centred on the 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <!-- envelope -->
  <g filter="url(#soft)">
    <rect x="222" y="318" width="580" height="400" rx="58" fill="url(#paper)"/>
  </g>
  <g clip-path="url(#envelopeClip)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 718 L452 528" stroke="#C9D5FA" stroke-width="30"/>
    <path d="M792 718 L572 528" stroke="#C9D5FA" stroke-width="30"/>
    <path d="M250 340 L512 548 L774 340" stroke="#3550E0" stroke-width="40"/>
  </g>

  <!-- new-mail badge -->
  <circle cx="784" cy="318" r="92" fill="url(#badge)" stroke="#FFFFFF" stroke-width="22"/>
</svg>
