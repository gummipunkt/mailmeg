name: Mailmeg
options:
  bundleIdPrefix: de.mailmeg
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Mailmeg.xcconfig
  Release: Config/Mailmeg.xcconfig
packages:
  MailmegKit:
    path: MailmegKit
targets:
  Mailmeg:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MailmegKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mailmeg
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "14.0"
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        NSHumanReadableCopyright: "© 2026 Patrick Walter"
    entitlements:
      path: App/Mailmeg.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mailmeg.app
        PRODUCT_NAME: Mailmeg
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
  MailmegUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Mailmeg
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mailmeg.uitests
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mailmeg
schemes:
  Mailmeg:
    build:
      targets:
        Mailmeg: all
        MailmegUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MailmegUITests
    archive:
      config: Release
