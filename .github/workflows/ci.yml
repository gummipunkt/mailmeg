name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test MailmegKit
        run: swift test --package-path MailmegKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Read version
        id: version
        run: |
          version=$(grep '^MARKETING_VERSION' Config/Mailmeg.xcconfig | cut -d= -f2 | tr -d ' ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MailMeG $version (build ${{ github.run_number }})"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version in Config/Mailmeg.xcconfig"
            exit 1
          fi

      - name: Build app (universal)
        run: |
          set -o pipefail
          xcodebuild \
            -project Mailmeg.xcodeproj \
            -scheme Mailmeg \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY=- \
            build
          app=build/Build/Products/Release/MailMeG.app
          lipo -archs $app/Contents/MacOS/MailMeG
          test -f $app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" $app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 $app

      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R build/Build/Products/Release/MailMeG.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "MailMeG ${{ steps.version.outputs.version }}" -srcfolder dmg -ov -format UDZO MailMeG.dmg
          hdiutil verify MailMeG.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: MailMeG-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: MailMeG.dmg

      # A new MARKETING_VERSION on main (or a pushed tag vX.Y.Z) publishes a regular, versioned
      # release; the tag is created by the release itself. Its DMG is always reachable at
      # https://github.com/<owner>/<repo>/releases/latest/download/MailMeG.dmg
      - name: Check for new version
        id: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.version.outputs.version }}
          python3 - "$version" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"^## \[?" + re.escape(version) + r"\]?.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(match.group(1).strip() if match else f"MailMeG {version}")
          PY
          cp MailMeG.dmg "MailMeG-$version.dmg"
          gh release create "${{ steps.release.outputs.tag }}" MailMeG.dmg "MailMeG-$version.dmg" \
            --target "$GITHUB_SHA" --title "MailMeG $version" --notes-file notes.md --latest

      # Every push to main refreshes the "nightly" pre-release with the newest development build.
      - name: Publish development build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          git tag -f nightly
          git push -f origin nightly
          notes="Development build ${{ steps.version.outputs.version }} (build ${{ github.run_number }}, ${GITHUB_SHA::7}). Not a stable release."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "MailMeG ${{ steps.version.outputs.version }} – development build" --notes "$notes"
            gh release upload nightly MailMeG.dmg --clobber
            gh release delete-asset nightly Mailmeg.dmg -y 2>/dev/null || true
          else
            gh release create nightly MailMeG.dmg --prerelease --title "MailMeG ${{ steps.version.outputs.version }} – development build" --notes "$notes"
          fi

  ui-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: UI tests (demo mode)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Mailmeg.xcodeproj \
            -scheme Mailmeg \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath UITests.xcresult \
            CODE_SIGN_IDENTITY=- \
            | grep -E "error:|warning: .*\.swift|Test Case|Executed|\*\* TEST|SIDEBAR-|MAILBOX-|^ *(Outline|Row|Cell|StaticText|Button|Image|Group|Other|OutlineRow)|→" || true
          xcrun xcresulttool get test-results summary --path UITests.xcresult 2>/dev/null | head -50 || true
          test "$(xcrun xcresulttool get test-results summary --path UITests.xcresult | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"])')" = "Passed"

      - name: App log
        if: always()
        run: log show --last 15m --style compact --predicate 'subsystem == "de.mailmeg.app"' | tail -80 || true

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          cp /tmp/mailmeg-screenshots/*.png screenshots/ 2>/dev/null || true
          if [ -d UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path UITests.xcresult --output-path screenshots/xcresult || true
          fi
          find screenshots -type f | sort

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots
          path: screenshots

      # Full-resolution demo screenshots for the website, kept at stable URLs:
      # https://github.com/<owner>/<repo>/releases/download/screenshots/landing-de-inbox-light.png
      - name: Publish landing page screenshots
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls /tmp/mailmeg-screenshots/landing-*.png >/dev/null 2>&1 || { echo "No landing page screenshots."; exit 0; }
          if ! gh release view screenshots >/dev/null 2>&1; then
            gh release create screenshots --prerelease --target "$GITHUB_SHA" --title "MailMeG – Screenshots" \
              --notes "Screenshots of the demo mailbox for the website, refreshed by CI."
          fi
          gh release upload screenshots /tmp/mailmeg-screenshots/landing-*.png --clobber

      # Small JPEG copies in the log, so the UI can be reviewed without downloading artifacts.
      - name: Print screenshots
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, shutil
          manifest = "screenshots/xcresult/manifest.json"
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for a in test.get("attachments", []):
                      name = a.get("suggestedHumanReadableName", "")
                      src = os.path.join("screenshots/xcresult", a["exportedFileName"])
                      if src.endswith(".png"):
                          shutil.copy(src, "screenshots/" + name.split("_0_")[0] + ".png")
                      elif name.startswith("App UI hierarchy") and src.endswith(".txt"):
                          print("HIERARCHY for", test.get("testIdentifier"))
                          print("".join(open(src).readlines()[:80]))
          PY
          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 70 -Z 1400 "$f" --out /tmp/shot.jpg >/dev/null
            echo "SCREENSHOT-BEGIN $(basename "$f" .png)"
            base64 -i /tmp/shot.jpg | fold -w 2000
            echo "SCREENSHOT-END"
          done
