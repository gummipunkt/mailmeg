name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test MailmegKit
        run: swift test --package-path MailmegKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project Mailmeg.xcodeproj \
            -scheme Mailmeg \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Package app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent Mailmeg.app Mailmeg.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mailmeg
          path: build/Build/Products/Release/Mailmeg.zip
