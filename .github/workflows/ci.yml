name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test MailmegKit
        run: swift test --package-path MailmegKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (universal)
        run: |
          set -o pipefail
          xcodebuild \
            -project Mailmeg.xcodeproj \
            -scheme Mailmeg \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            build
          lipo -archs build/Build/Products/Release/Mailmeg.app/Contents/MacOS/Mailmeg
          test -f build/Build/Products/Release/Mailmeg.app/Contents/Resources/AppIcon.icns
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/Mailmeg.app

      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R build/Build/Products/Release/Mailmeg.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Mailmeg -srcfolder dmg -ov -format UDZO Mailmeg.dmg
          hdiutil verify Mailmeg.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Mailmeg
          path: Mailmeg.dmg

      # Every push to the main or development branch updates the "latest" pre-release
      # so there is always a stable download link for the newest DMG.
      - name: Move "latest" tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/festive-franklin-hnzinf')
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/festive-franklin-hnzinf')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automatischer Build von ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Installation und Gatekeeper-Hinweise: siehe README."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --prerelease --title "Mailmeg (neuester Build)" --notes "$notes"
            gh release upload latest Mailmeg.dmg --clobber
          else
            gh release create latest Mailmeg.dmg --prerelease --title "Mailmeg (neuester Build)" --notes "$notes"
          fi

  ui-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: UI tests (demo mode)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Mailmeg.xcodeproj \
            -scheme Mailmeg \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath UITests.xcresult \
            CODE_SIGN_IDENTITY=- \
            | grep -E "error:|warning: .*\.swift|Test Case|Executed|\*\* TEST|SIDEBAR-|MAILBOX-|^ *(Outline|Row|Cell|StaticText|Button|Image|Group|Other|OutlineRow)|→" || true
          xcrun xcresulttool get test-results summary --path UITests.xcresult 2>/dev/null | head -50 || true
          test "$(xcrun xcresulttool get test-results summary --path UITests.xcresult | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"])')" = "Passed"

      - name: App log
        if: always()
        run: log show --last 15m --style compact --predicate 'subsystem == "de.mailmeg.app"' | tail -80 || true

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          cp /tmp/mailmeg-screenshots/*.png screenshots/ 2>/dev/null || true
          if [ -d UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path UITests.xcresult --output-path screenshots/xcresult || true
          fi
          find screenshots -type f | sort

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots
          path: screenshots

      # Small JPEG copies in the log, so the UI can be reviewed without downloading artifacts.
      - name: Print screenshots
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, shutil
          manifest = "screenshots/xcresult/manifest.json"
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for a in test.get("attachments", []):
                      name = a.get("suggestedHumanReadableName", "")
                      src = os.path.join("screenshots/xcresult", a["exportedFileName"])
                      if src.endswith(".png"):
                          shutil.copy(src, "screenshots/" + name.split("_0_")[0] + ".png")
                      elif name.startswith("App UI hierarchy") and src.endswith(".txt"):
                          print("HIERARCHY for", test.get("testIdentifier"))
                          print("".join(open(src).readlines()[:80]))
          PY
          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 70 -Z 1400 "$f" --out /tmp/shot.jpg >/dev/null
            echo "SCREENSHOT-BEGIN $(basename "$f" .png)"
            base64 -i /tmp/shot.jpg | fold -w 2000
            echo "SCREENSHOT-END"
          done
